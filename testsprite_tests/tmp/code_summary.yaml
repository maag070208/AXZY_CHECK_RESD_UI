  api_port: 4444
  api_health: HTTP 200 on POST /users/login
  web_status: running
  web_port: 12345
  web_health: HTTP 200 on GET /
  server_mode: development

known_gotchas:
  - HashRouter: URLs are /#/path. Tests must page.goto("/#/path").
  - Endpoint /properties → /houses/datatable (Prisma model is House, not Property).
  - 'Datatable filter role="GUARD" must be converted to role.name="GUARD" server-side.'
  - All Prisma Decimal values arrive as strings in JSON.
  - JWT test bypass: in test env, req.headers['user'] accepted as JSON.
  - No raw HTML primitives; use IT* components.
  - No comments in code; no `any`; Spanish for user copy.
  - Mock e2e users.spec.ts:478 flaky (first <h1> is on login page).
  - residents.spec.ts uses .includes() not === for Unicode names (García ≠ Garcia).
  - Houses on Calle Los Olivos 201-209, Paseo del Bosque 1-19, Privada de las Flores 102-110.
  - Resident Rosa María Vega Contreras in Calle Los Olivos 203.
  - Guards: Mario García Sandoval (MAINT), Ricardo Mendoza Ríos (SHIFT), Asael Morales Rivera (GUARD, on page 2 of users).

